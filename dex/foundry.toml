# Agentswap DEX contracts — separate Foundry project for the Uniswap V3 fork.
# solc 0.7.6 predates the Paris EVM target; Forge resolves to the newest target
# solc 0.7.6 supports. No PUSH0 can be emitted by this compiler.
[profile.default]
src = "contracts"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.7.6"
optimizer = true
optimizer_runs = 200
evm_version = "paris"

# Vendored upstream sources are kept byte-identical to their pinned tags and
# are formatted upstream (prettier-solidity), not with forge fmt.
[fmt]
ignore = ["contracts/**"]
